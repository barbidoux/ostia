[workspace]
members = ["crates/contracts", "crates/core-domain", "crates/traceability"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/barbidoux/ostia"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
# NFR-09: no unsafe outside the crates listed in docs/unsafe-allowlist.md. `forbid` cannot be
# relaxed by a local allow, so a listed crate declares its own [lints] instead of inheriting these.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
