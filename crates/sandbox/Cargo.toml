[package]
name = "ostia-sandbox"
description = "Ostia worker launch and limits: the worker host (framed exchange, object as descriptor 3, timeout)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ostia-contracts = { path = "../contracts" }
# Q-47: the object on the worker's descriptor 3 (command-fds), the worker's process group killed and its exit
# observed before it is reaped (nix), with no unsafe code in Ostia.
command-fds = "=0.3.3"
nix = { version = "=0.31.3", features = ["fs", "process", "signal"] }

[dev-dependencies]
ostia-traceability = { path = "../traceability" }

[lints]
workspace = true
