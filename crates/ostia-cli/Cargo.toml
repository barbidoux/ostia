[package]
name = "ostia-cli"
description = "The `ostia` command line (docs/contracts/cli.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ostia"
path = "src/main.rs"

[features]
# Development flags (`--dev-*`, docs/contracts/cli.md): debug builds only, never in a release build.
dev = []

[dependencies]
ostia-core-domain = { path = "../core-domain" }
serde_json = "=1.0.151"

[dev-dependencies]
ostia-traceability = { path = "../traceability" }
ed25519-dalek = "=3.0.0"
sha2 = "=0.11.0"

[lints]
workspace = true
