[package]
name = "ostia-core-domain"
description = "Ostia domain model: sessions, media, object tree, verdicts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ostia-contracts = { path = "../contracts" }
thiserror = "=2.0.21"
# Verdict policy loader (Q-43): Ed25519 over the exact bytes, strict JSON, SHA-256 of the file.
ed25519-dalek = "=3.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[dev-dependencies]
ostia-traceability = { path = "../traceability" }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true
