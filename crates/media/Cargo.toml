[package]
name = "ostia-media"
description = "Ostia media access: read-only mounts of the analysed medium (development loop mounts in P1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ostia-core-domain = { path = "../core-domain" }
thiserror = "=2.0.21"
# Inventory (Q-50): extended attributes and NTFS streams on the opened descriptor (rustix), the single read's
# SHA-256 and SHA-1.
rustix = { version = "=1.1.5", features = ["fs"] }
sha1 = "=0.11.0"
sha2 = "=0.11.0"

[dev-dependencies]
ostia-traceability = { path = "../traceability" }

[lints]
workspace = true
