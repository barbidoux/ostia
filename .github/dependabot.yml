# Monthly version updates, one grouped pull request per dependency set.
# Security updates are enabled separately in the repository settings.
# Commits read `build(deps): ...` to pass the commit-msg hook.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # The fuzz targets are a separate Cargo workspace with their own Cargo.lock.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo-fuzz:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment; Dependabot updates both.
  # rails.yml is a rails file: any change outside the owner's rails update fails `rails-verify`, so
  # Dependabot leaves it out (the owner updates its actions with the rails kit).
  - package-ecosystem: github-actions
    directory: /
    exclude-paths:
      - .github/workflows/rails.yml
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
