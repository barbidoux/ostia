# NFR-06: long nightly fuzzing of the frame decoder. The corpus grows from night to night in the Actions
# cache; a crash or a timeout fails the run and its input is uploaded as the `fuzz-artifacts` artifact
# (add it to fuzz/regressions/ as a .hex file). The per-push run is the `fuzz` job of ci.yml.
name: fuzz-nightly
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: debian:13
    env:
      FUZZ_SECONDS: "1800"
      FUZZ_CORPUS: fuzz/corpus/frame_decoder
      FUZZ_ARTIFACTS: fuzz/artifacts
    steps:
      - name: Bootstrap packages (for the checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: System packages and tool versions (tools/dev/packages.txt, tools/dev/versions.env)
        run: |
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' tools/dev/packages.txt \
            | xargs apt-get install -y --no-install-recommends
          cat tools/dev/versions.env >> "$GITHUB_ENV"
      - name: Cache toolchains and fuzz builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.rustup
            ~/.cache/uv
            ~/.local/share/uv
            ~/.local/bin
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'fuzz/Cargo.lock', 'uv.lock', 'tools/dev/versions.env') }}
      - name: Corpus (grows every night)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Toolchains (stable, pinned nightly, cargo-fuzz, uv, just)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfo /tmp/rustup-init.sh https://sh.rustup.rs
          sh /tmp/rustup-init.sh -y --default-toolchain none --profile minimal
          curl --proto '=https' --tlsv1.2 -LsSfo /tmp/uv-install.sh "https://astral.sh/uv/${UV_VERSION}/install.sh"
          sh /tmp/uv-install.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          rustup toolchain install
          rustup toolchain install "${NIGHTLY_TOOLCHAIN}" --profile minimal
          cargo fuzz --version 2>/dev/null | grep -q "${CARGO_FUZZ_VERSION}" \
            || cargo install --locked "cargo-fuzz@${CARGO_FUZZ_VERSION}"
          uv tool install "rust-just==${JUST_VERSION}"
          uv sync --frozen
      - name: Fuzz suite (frame decoder for FUZZ_SECONDS on the cached corpus)
        run: just test-fuzz
      - name: Crash and timeout inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
