# Project CI: `just check` on Debian stable (NFR-15), then the acceptance policy of prompts/P0.md:
# locked directories of closed phases gate (blocking), the current phase's directory is informational
# ("N/M green"), future phases are not run. The rails check lives in its own owner-managed workflow.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    # Privileged: loop devices for the disk-image tests (docs/questions.md Q-12).
    container:
      image: debian:13
      options: --privileged
    steps:
      - name: Bootstrap packages (for the checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: System packages and tool versions (tools/dev/packages.txt, tools/dev/versions.env)
        run: |
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' tools/dev/packages.txt \
            | xargs apt-get install -y --no-install-recommends
          cat tools/dev/versions.env >> "$GITHUB_ENV"
      - name: Cache toolchains and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.rustup
            ~/.cache/uv
            ~/.local/share/uv
            ~/.local/bin
            target
          key: ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'uv.lock', 'tools/dev/versions.env') }}
      - name: Toolchains (rustup from rust-toolchain.toml, uv, just, cargo-nextest)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfo /tmp/rustup-init.sh https://sh.rustup.rs
          sh /tmp/rustup-init.sh -y --default-toolchain none --profile minimal
          curl --proto '=https' --tlsv1.2 -LsSfo /tmp/uv-install.sh "https://astral.sh/uv/${UV_VERSION}/install.sh"
          sh /tmp/uv-install.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          rustup toolchain install
          uv tool install "rust-just==${JUST_VERSION}"
          cargo nextest --version 2>/dev/null | grep -q "${NEXTEST_VERSION}" \
            || cargo install --locked "cargo-nextest@${NEXTEST_VERSION}"
          # Supply-chain gates of `just audit` (WP-0.8), cached in ~/.cargo/bin like nextest.
          cargo deny --version 2>/dev/null | grep -q "${CARGO_DENY_VERSION}" \
            || cargo install --locked "cargo-deny@${CARGO_DENY_VERSION}"
          cargo audit --version 2>/dev/null | grep -q "${CARGO_AUDIT_VERSION}" \
            || cargo install --locked "cargo-audit@${CARGO_AUDIT_VERSION}"
          cargo cyclonedx --version 2>/dev/null | grep -q "${CARGO_CYCLONEDX_VERSION}" \
            || cargo install --locked "cargo-cyclonedx@${CARGO_CYCLONEDX_VERSION}"
          uv sync --frozen
      - name: Check
        run: just check
      - name: Acceptance gates (closed phases, blocking)
        run: |
          mkdir -p target
          python3 tools/ci/acceptance_plan.py --status docs/phase-status.md --acceptance tests/acceptance \
            > target/acceptance-plan.json
          cat target/acceptance-plan.json
          # Acceptance tests run target/debug/ostia: build it from this commit, never from the cache.
          cargo build --workspace --locked
          for dir in $(python3 -c 'import json; print(" ".join(json.load(open("target/acceptance-plan.json"))["gate"]))'); do
            python3 tools/lock/ostia_lock.py gate "$dir"
          done

  fuzz:
    # NFR-06: the frame decoder is fuzzed for a fixed time on every push and pull request, and a planted
    # crash must be caught (tests/fuzz). The long run is .github/workflows/fuzz-nightly.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:13
    env:
      FUZZ_SECONDS: "60"
    steps:
      - name: Bootstrap packages (for the checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: System packages and tool versions (tools/dev/packages.txt, tools/dev/versions.env)
        run: |
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' tools/dev/packages.txt \
            | xargs apt-get install -y --no-install-recommends
          cat tools/dev/versions.env >> "$GITHUB_ENV"
      - name: Cache toolchains and fuzz builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.rustup
            ~/.cache/uv
            ~/.local/share/uv
            ~/.local/bin
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'fuzz/Cargo.lock', 'uv.lock', 'tools/dev/versions.env') }}
      - name: Toolchains (stable, pinned nightly, cargo-fuzz, uv, just)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfo /tmp/rustup-init.sh https://sh.rustup.rs
          sh /tmp/rustup-init.sh -y --default-toolchain none --profile minimal
          curl --proto '=https' --tlsv1.2 -LsSfo /tmp/uv-install.sh "https://astral.sh/uv/${UV_VERSION}/install.sh"
          sh /tmp/uv-install.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          rustup toolchain install
          rustup toolchain install "${NIGHTLY_TOOLCHAIN}" --profile minimal
          cargo fuzz --version 2>/dev/null | grep -q "${CARGO_FUZZ_VERSION}" \
            || cargo install --locked "cargo-fuzz@${CARGO_FUZZ_VERSION}"
          uv tool install "rust-just==${JUST_VERSION}"
          uv sync --frozen
      - name: Fuzz suite (frame decoder for FUZZ_SECONDS, planted crash caught)
        run: just test-fuzz

  acceptance-current:
    # Informational: the current phase's acceptance tests turn green during the phase.
    needs: ci
    runs-on: ubuntu-latest
    # Privileged: loop devices for the disk-image tests (docs/questions.md Q-12).
    container:
      image: debian:13
      options: --privileged
    continue-on-error: true
    steps:
      - name: Bootstrap packages (for the checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: System packages and tool versions (tools/dev/packages.txt, tools/dev/versions.env)
        run: |
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' tools/dev/packages.txt \
            | xargs apt-get install -y --no-install-recommends
          cat tools/dev/versions.env >> "$GITHUB_ENV"
      - name: Cache toolchains and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.rustup
            ~/.cache/uv
            ~/.local/share/uv
            ~/.local/bin
            target
          key: ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'uv.lock', 'tools/dev/versions.env') }}
      - name: Toolchains
        run: |
          curl --proto '=https' --tlsv1.2 -sSfo /tmp/rustup-init.sh https://sh.rustup.rs
          sh /tmp/rustup-init.sh -y --default-toolchain none --profile minimal
          curl --proto '=https' --tlsv1.2 -LsSfo /tmp/uv-install.sh "https://astral.sh/uv/${UV_VERSION}/install.sh"
          sh /tmp/uv-install.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          rustup toolchain install
          uv tool install "rust-just==${JUST_VERSION}"
          uv sync --frozen
      - name: Current phase acceptance (N/M green)
        run: |
          mkdir -p target
          python3 tools/ci/acceptance_plan.py --status docs/phase-status.md --acceptance tests/acceptance \
            > target/acceptance-plan.json
          cargo build --workspace --locked
          for dir in $(python3 -c 'import json; print(" ".join(json.load(open("target/acceptance-plan.json"))["informational"]))'); do
            just test-acceptance "$dir" -- "--junitxml=target/acceptance-$dir.xml"
            python3 - "$dir" <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import sys, xml.etree.ElementTree as ET
          name = sys.argv[1]
          suites = list(ET.parse(f"target/acceptance-{name}.xml").getroot().iter("testsuite"))
          total = sum(int(s.get("tests", 0)) for s in suites)
          bad = sum(int(s.get(k, 0)) for s in suites for k in ("failures", "errors", "skipped"))
          print(f"tests/acceptance/{name}: {total - bad}/{total} green")
          EOF
          done

  red-first:
    # Spec §18 cycle rules 1 and 3: each test(<ID>) commit of the pull request fails at its commit, for a
    # valid reason, a later feat/fix/build/ci(<ID>) commit implements it, and no other commit touches the
    # tests (tools/ci/red_first.py).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The same container as the ci job: disk-image tests need loop devices (docs/questions.md Q-12).
    container:
      image: debian:13
      options: --privileged
    steps:
      - name: Bootstrap packages (for the checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: System packages and tool versions (tools/dev/packages.txt, tools/dev/versions.env)
        run: |
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' tools/dev/packages.txt \
            | xargs apt-get install -y --no-install-recommends
          cat tools/dev/versions.env >> "$GITHUB_ENV"
      - name: Cache toolchains and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.rustup
            ~/.cache/uv
            ~/.local/share/uv
            ~/.local/bin
            target
          key: ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'uv.lock', 'tools/dev/versions.env') }}
      - name: Toolchains (rustup from rust-toolchain.toml, uv, cargo-nextest)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfo /tmp/rustup-init.sh https://sh.rustup.rs
          sh /tmp/rustup-init.sh -y --default-toolchain none --profile minimal
          curl --proto '=https' --tlsv1.2 -LsSfo /tmp/uv-install.sh "https://astral.sh/uv/${UV_VERSION}/install.sh"
          sh /tmp/uv-install.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          rustup toolchain install
          uv tool install "rust-just==${JUST_VERSION}"
          cargo nextest --version 2>/dev/null | grep -q "${NEXTEST_VERSION}" \
            || cargo install --locked "cargo-nextest@${NEXTEST_VERSION}"
          uv sync --frozen
      - name: Red-first (each test commit fails before its implementation)
        run: python3 tools/ci/red_first.py --base "origin/${{ github.base_ref }}"
