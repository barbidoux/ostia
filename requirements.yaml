- id: USB-02
  level: MUST
  phases:
  - P4
  phase_source: spec
  anssi:
  - FS14
  section: 10. USB device defence (BadUSB)
  text: Internal devices (touchscreen and the like) are allowed only by exact identity, port and descriptor
