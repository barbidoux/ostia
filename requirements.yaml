- id: USB-06
  level: SHOULD
  phases:
  - P4
  phase_source: spec
  anssi: []
  section: 10. USB device defence (BadUSB)
  text: 'Anomaly heuristics raise USB findings: several configurations, vendor-specific interfaces, inconsistent
