- id: USB-01
  level: MUST
  phases:
  - P4
  phase_source: spec
  anssi:
  - FS14
  section: 10. USB device defence (BadUSB)
  text: External ports accept only devices whose interface set is exactly one mass-storage interface (USBGuard
