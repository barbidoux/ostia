    still gets no driver'
- id: USB-04
  level: MUST
  phases:
  - P4
  phase_source: spec
  anssi:
  - FS14
  section: 10. USB device defence (BadUSB)
  text: 'The input device is watched for the whole session: any re-enumeration, new interface or configuration
    change aborts the session, discards its results and raises a USB alert'
- id: USB-05
  level: MUST
  phases:
  - P4
  phase_source: spec
  anssi:
  - FS9
  section: 10. USB device defence (BadUSB)
  text: 'A descriptor fingerprint is logged for every device: VID/PID, serial, bcdDevice, strings, interface
