  level: MUST
  phases:
  - P6
  phase_source: spec
  anssi:
  - FS9
  section: 15. Logging and central forwarding
  text: Any alteration or deletion of an entry is detected by chain verification
- id: LOG-04
  level: MUST
  phases:
  - P6
  phase_source: spec
  anssi:
  - FS4
  - FS9
  - FS12
  section: 15. Logging and central forwarding
  text: Rotation when capacity is reached, with administrator notification; the kiosk stays operational
- id: LOG-05
  level: MUST
  phases:
  - P6
  phase_source: spec
  anssi:
  - FS4
  - FS9
  section: 15. Logging and central forwarding
  text: The logging service runs under an isolated unprivileged account
