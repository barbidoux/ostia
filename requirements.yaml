  - FS14
  section: 13. Isolation and hardening
  text: Mounting and raw reads go through a minimal privileged helper that validates its parameters and
    mounts in a dedicated namespace; kernel modules of unsupported file systems are disabled
- id: SEC-09
  level: MUST
  phases:
  - P4
  phase_source: spec
  anssi:
  - FS14
  section: 13. Isolation and hardening
  text: The output medium is identified as controlled (kiosk-written marker) and can never be the input
    medium
- id: SEC-10
  level: MUST
  phases:
  - P1
  phase_source: spec
  anssi:
  - FS1
  section: 13. Isolation and hardening
  text: Each file is read once from the medium; the scanned copy is the one transferred, closing the window
    between scan and copy
- id: SEC-11
  level: MUST
  phases:
  - P4
  phase_source: spec
  anssi:
  - FS14
  section: 13. Isolation and hardening
  text: The workspace is an encrypted volume with an ephemeral per-session key, destroyed at session end
- id: SEC-12
  level: MUST
  phases:
  - P4
  phase_source: spec
  anssi:
  - FS14
  section: 13. Isolation and hardening
  text: No file from the input medium can be executed by the kiosk
- id: SEC-13
  level: MUST
  phases:
  - P3
  phase_source: spec
  anssi:
  - FS11
  section: 13. Isolation and hardening
  text: Third-party engines get no more privilege than built-in ones; their crashes and timeouts are handled
    like any worker
- id: SEC-14
  level: MUST
  phases:
  - P8
  phase_source: spec
  anssi: []
  section: 13. Isolation and hardening
