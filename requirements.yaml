- id: USB-03
  level: MUST
  phases:
  - P4
  phase_source: spec
  anssi:
  - FS14
  section: 10. USB device defence (BadUSB)
  text: 'Driver allowlist: on external ports only the `usb-storage` and `uas` drivers may bind; HID, communications,
