# cargo-deny policy for the Rust workspace and the fuzz workspace (UPD-07, NFR-11).
# Owner-gated after WP-0.8: a change of this file needs the owner's approval.
# The licence allowlist is also the allowlist of the Python dependencies (tools/supply/python_licences.py).
# Run by `just audit`: `cargo deny --workspace --locked --config deny.toml check`.

[graph]
all-features = true

[advisories]
# Vulnerabilities always fail. An advisory that does not apply is ignored one by one, with the owner's
# approval and a reason (docs/questions.md Q-27); none is today.
ignore = []
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
# prompts/P0.md (WP-0.8), MPL-2.0 as file-level copyleft (Q-26), and the permissive licences of the
# approved Python tools (Q-25: MIT-0, 0BSD, PSF-2.0).
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "MIT-0",
    "0BSD",
    "PSF-2.0",
]
confidence-threshold = 0.8
# Some allowed licences serve only the Python side.
unused-allowed-license = "allow"
exceptions = [
    # The bundled libFuzzer (fuzz workspace only, never shipped; Q-23).
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[licenses.private]
# Our own crates are checked too.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our unpublished crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
